name: Build SDK Examples

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  integrity:
    name: Verify package integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify published files
        run: python3 scripts/test_all_examples.py --verify-only

  linux-x64:
    name: Ubuntu 24.04 x64
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0-dev libssl-dev

      - name: Build and test every supported example
        run: python3 scripts/test_all_examples.py --build-dir build

      - name: Verify relocatable runtime
        run: |
          for example in \
            prism-device-info-time-sync \
            prism-camera-imu-capture \
            prism-client-api-examples \
            prism-configuration-api-examples \
            prism-lidar-capture \
            prism-parser-api-examples \
            prism-stream-api-examples; do
            test -x "build/examples/$example"
          done
          cmp runtime/linux-x64/libprism_usb_sdk.so \
            build/examples/libprism_usb_sdk.so
          readelf -d build/examples/prism-device-info-time-sync \
            | grep -Fq "Library runpath: [\$ORIGIN]"

      - name: Smoke-test SDK loading and enumeration
        run: |
          set +e
          output="$(build/examples/prism-device-info-time-sync 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$output" = 'error: no Prism device found'

      - name: Build and test static SDK examples
        run: |
          cmake -S . -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DPRISM_SDK_USE_STATIC=ON
          cmake --build build-static --parallel --target prism-all-examples
          ctest --test-dir build-static --output-on-failure
          test ! -e build-static/examples/libprism_usb_sdk.so
          if readelf -d build-static/examples/prism-device-info-time-sync \
              | grep -Fq libprism_usb_sdk.so; then
            echo "Static example still depends on libprism_usb_sdk.so" >&2
            exit 1
          fi

  linux-x64-compatibility:
    name: Ubuntu ${{ matrix.ubuntu }} x64 unified shared runtime
    needs: integrity
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["20.04", "22.04", "24.04", "26.04"]
    steps:
      - name: Install build and runtime dependencies
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake git \
            libusb-1.0-0-dev python3 python3-pip
          if [ "$UBUNTU_VERSION" = "20.04" ]; then
            python3 -m pip install --no-cache-dir cmake==3.31.6
          fi

      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test unified shared runtime
        run: python3 scripts/test_all_examples.py --build-dir build-compat

      - name: Verify dynamic dependency boundary
        run: |
          needed="$(readelf -d runtime/linux-x64/libprism_usb_sdk.so)"
          printf '%s\n' "$needed"
          grep -Fq 'Shared library: [libusb-1.0.so.0]' <<<"$needed"
          if grep -Eq 'Shared library: \[lib(ssl|crypto)\.so' <<<"$needed"; then
            echo 'Unified x86-64 SDK must not depend on dynamic OpenSSL' >&2
            exit 1
          fi

      - name: Smoke-test SDK loading and enumeration
        run: |
          set +e
          output="$(build-compat/examples/prism-device-info-time-sync 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$output" = 'error: no Prism device found'

  linux-arm64:
    name: Ubuntu 24.04 arm64
    needs: integrity
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = "aarch64"

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libusb-1.0-0-dev libssl-dev

      - name: Build and test every supported example
        run: python3 scripts/test_all_examples.py --build-dir build

      - name: Verify relocatable runtime
        run: |
          for example in \
            prism-device-info-time-sync \
            prism-camera-imu-capture \
            prism-client-api-examples \
            prism-configuration-api-examples \
            prism-lidar-capture \
            prism-parser-api-examples \
            prism-stream-api-examples; do
            test -x "build/examples/$example"
          done
          cmp runtime/linux-arm64/libprism_usb_sdk.so \
            build/examples/libprism_usb_sdk.so
          readelf -d build/examples/prism-device-info-time-sync \
            | grep -Fq "Library runpath: [\$ORIGIN]"

      - name: Smoke-test SDK loading and enumeration
        run: |
          set +e
          output="$(build/examples/prism-device-info-time-sync 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$output" = 'error: no Prism device found'

      - name: Build and test static SDK examples
        run: |
          cmake -S . -B build-static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS=-Werror \
            -DPRISM_SDK_USE_STATIC=ON
          cmake --build build-static --parallel --target prism-all-examples
          ctest --test-dir build-static --output-on-failure
          test ! -e build-static/examples/libprism_usb_sdk.so
          if readelf -d build-static/examples/prism-device-info-time-sync \
              | grep -Fq libprism_usb_sdk.so; then
            echo "Static example still depends on libprism_usb_sdk.so" >&2
            exit 1
          fi

  macos-arm64:
    name: macOS 15 arm64
    needs: integrity
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        run: test "$(uname -m)" = "arm64"

      - name: Build and test every supported example
        run: python3 scripts/test_all_examples.py --build-dir build

      - name: Verify relocatable runtime
        run: |
          for example in \
            prism-device-info-time-sync \
            prism-camera-imu-capture \
            prism-client-api-examples \
            prism-configuration-api-examples \
            prism-lidar-capture \
            prism-parser-api-examples \
            prism-stream-api-examples; do
            test -x "build/examples/$example"
          done
          cmp runtime/macos-arm64/libprism_usb_sdk.dylib \
            build/examples/libprism_usb_sdk.dylib
          cmp runtime/macos-arm64/libusb-1.0.0.dylib \
            build/examples/libusb-1.0.0.dylib
          codesign --verify --strict build/examples/libprism_usb_sdk.dylib
          codesign --verify --strict build/examples/libusb-1.0.0.dylib
          otool -l build/examples/prism-device-info-time-sync \
            | grep -A3 LC_RPATH \
            | grep -Fq '@executable_path'
          otool -l build/examples/prism-device-info-time-sync \
            | grep -A6 LC_BUILD_VERSION \
            | grep -Fq 'minos 13.0'

      - name: Smoke-test SDK loading and enumeration
        run: |
          set +e
          output="$(build/examples/prism-device-info-time-sync 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -eq 1
          test "$output" = 'error: no Prism device found'

  windows-x64:
    name: Windows Server 2022 x64
    needs: integrity
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify runner architecture
        shell: pwsh
        run: |
          if (-not [Environment]::Is64BitProcess) {
            throw 'The Windows build must run in a 64-bit process.'
          }

      - name: Build and test every supported example
        shell: pwsh
        run: python scripts/test_all_examples.py --build-dir build

      - name: Verify copied runtime
        shell: pwsh
        run: |
          $examples = @(
            'build/examples/Release/prism-device-info-time-sync.exe',
            'build/examples/Release/prism-windows-runtime-api-examples.exe'
          )
          $copiedDll = 'build/examples/Release/prism_usb_sdk.dll'
          $sourceDll = 'runtime/windows-x64/prism_usb_sdk.dll'
          foreach ($exe in $examples) {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Missing example executable: $exe"
            }
          }
          if (-not (Test-Path -LiteralPath $copiedDll -PathType Leaf)) {
            throw "Missing copied SDK runtime: $copiedDll"
          }
          $copiedHash = (Get-FileHash -Algorithm SHA256 $copiedDll).Hash
          $sourceHash = (Get-FileHash -Algorithm SHA256 $sourceDll).Hash
          if ($copiedHash -cne $sourceHash) {
            throw 'Copied SDK runtime differs from the published DLL.'
          }

      - name: Smoke-test SDK loading and enumeration
        shell: pwsh
        run: |
          $exe = (Resolve-Path -LiteralPath 'build/examples/Release/prism-device-info-time-sync.exe').Path
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'prism-stdout.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'prism-stderr.txt'
          $process = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath
          $stdout = [IO.File]::ReadAllText($stdoutPath)
          $stderr = [IO.File]::ReadAllText($stderrPath)
          Write-Host $stdout
          Write-Host $stderr
          if ($process.ExitCode -ne 1) {
            throw "Expected exit code 1, got $($process.ExitCode)."
          }
          if ($stdout.Trim().Length -ne 0) {
            throw "Unexpected stdout: $stdout"
          }
          if ($stderr.Trim() -cne 'error: no Prism device found') {
            throw "Unexpected stderr: $stderr"
          }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux-x64, linux-x64-compatibility, linux-arm64, macos-arm64, windows-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out SDK package
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate tag and package SDK
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "1.0.0"
          git archive --format=tar --prefix="Prism-SDK-${version}/" HEAD \
            | gzip -9 > "Prism-SDK-${version}.tar.gz"
          sha256sum "Prism-SDK-${version}.tar.gz" \
            > "Prism-SDK-${version}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              Prism-SDK-1.0.0.tar.gz \
              Prism-SDK-1.0.0.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              Prism-SDK-1.0.0.tar.gz \
              Prism-SDK-1.0.0.tar.gz.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes
          fi
