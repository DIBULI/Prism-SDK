name: PPS5 maintenance validation
on:
  push:
    branches: ["codex/maintenance-1.2.1-pps5ms"]
    tags: ["v1.2.1-pps5ms"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libusb-1.0-0-dev
      - run: sha256sum -c SHA256SUMS
      - run: cmake -S . -B build && cmake --build build -j2
