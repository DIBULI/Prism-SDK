name: Rebuild SDK 1.1.0 runtimes

on:
  workflow_dispatch:
  push:
    branches: [codex/sdk-1.1.0]
    paths: [.github/workflows/build-runtimes.yml]

permissions:
  contents: read

env:
  AGENT_SOURCE_COMMIT: e47627fab53946c854bbdb0f83fee9a0a209d98e

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:20.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - name: Install build dependencies on the Ubuntu 20.04 ABI baseline
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sed -i -E 's#http://(archive.ubuntu.com|security.ubuntu.com)/ubuntu#http://mirrors.tuna.tsinghua.edu.cn/ubuntu#g; s#http://ports.ubuntu.com/ubuntu-ports#http://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports#g' /etc/apt/sources.list
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates git \
            libssl-dev libusb-1.0-0-dev ninja-build pkg-config python3-pip file
          python3 -m pip install --no-cache-dir -i https://pypi.tuna.tsinghua.edu.cn/simple cmake==3.31.6
      - uses: actions/checkout@v6
        with:
          repository: DIBULI/Prism-agent
          ref: ${{ env.AGENT_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Build and test shared and static Host SDK
        run: |
          set -euo pipefail
          for linkage in shared static; do
            shared=OFF
            if [ "$linkage" = shared ]; then shared=ON; fi
            cmake -S source/prism-sdk -B "build-$linkage" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DPRISM_USB_SDK_SHARED="$shared" \
              -DOPENSSL_USE_STATIC_LIBS=TRUE -DBUILD_TESTING=ON
            cmake --build "build-$linkage" --parallel 4
            ctest --test-dir "build-$linkage" --output-on-failure
            cmake --install "build-$linkage" --prefix "$PWD/artifact/host-$linkage"
          done
          if readelf -d artifact/host-shared/lib/libprism_usb_sdk.so | grep -Eq 'NEEDED.*lib(ssl|crypto)'; then
            echo 'Shared SDK unexpectedly requires a system OpenSSL runtime' >&2
            exit 1
          fi
          cp /usr/share/doc/libssl-dev/copyright artifact/openssl-copyright.txt
          printf 'AGENT_SOURCE_COMMIT=%s\nSDK_VERSION=1.1.0\nBASELINE=Ubuntu 20.04\n' "$AGENT_SOURCE_COMMIT" > artifact/PROVENANCE.txt
      - name: Build and test RK-local SDK on ARM64
        if: matrix.arch == 'arm64'
        run: |
          cmake -S source/prism-rklocal-sdk -B build-rklocal -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build-rklocal --parallel 4
          ctest --test-dir build-rklocal --output-on-failure
          cmake --install build-rklocal --prefix "$PWD/artifact/rklocal"
      - uses: actions/upload-artifact@v7
        with:
          name: prism-sdk-1.1.0-linux-${{ matrix.arch }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DIBULI/Prism-agent
          ref: ${{ env.AGENT_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: libusb/libusb
          ref: v1.0.30
          path: libusb-source
          persist-credentials: false
      - name: Build bundled libusb for macOS 13
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install autoconf automake libtool pkgconf
          cd libusb-source
          ./bootstrap.sh
          ./configure --prefix="$RUNNER_TEMP/prism-libusb" --disable-static \
            CFLAGS='-O2 -mmacosx-version-min=13.0'
          make -j4
          make install
          cp COPYING "$RUNNER_TEMP/prism-libusb/COPYING"
      - name: Build, test and install Host SDK
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$RUNNER_TEMP/prism-libusb/lib/pkgconfig"
          cmake -S source/prism-sdk -B build-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 -DPRISM_USB_SDK_SHARED=ON \
            -DBUILD_TESTING=ON
          cmake --build build-host --parallel 4
          ctest --test-dir build-host --output-on-failure
          cmake --install build-host --prefix "$PWD/artifact/host-shared"
          for library in artifact/host-shared/lib/*.dylib; do
            codesign --verify --strict "$library"
            otool -L "$library"
            otool -l "$library" | grep -A6 LC_BUILD_VERSION
          done
          printf 'AGENT_SOURCE_COMMIT=%s\nSDK_VERSION=1.1.0\nMIN_MACOS=13.0\nLIBUSB=1.0.30\n' "$AGENT_SOURCE_COMMIT" > artifact/PROVENANCE.txt
      - uses: actions/upload-artifact@v7
        with:
          name: prism-sdk-1.1.0-macos-arm64
          path: artifact/
          if-no-files-found: error
          retention-days: 14

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          repository: DIBULI/Prism-agent
          ref: ${{ env.AGENT_SOURCE_COMMIT }}
          path: source
          persist-credentials: false
      - name: Build, test and install Host SDK
        shell: pwsh
        run: |
          cmake -S source/prism-sdk -B build-host -A x64 -DPRISM_USB_SDK_SHARED=ON -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-host --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-host -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-host --config Release --prefix "$pwd/artifact/host-shared"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENT_SOURCE_COMMIT=$env:AGENT_SOURCE_COMMIT`nSDK_VERSION=1.1.0" | Out-File artifact/PROVENANCE.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: prism-sdk-1.1.0-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 14
